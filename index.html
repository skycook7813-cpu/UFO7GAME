<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極度刮躁｜定價＋開獎號碼 V20</title><style>body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:linear-gradient(#eefdfb,#fff);color:#1f2937}.wrap{max-width:560px;margin:auto}.hero,.card,.item{background:#fff;border:1px solid #d1f3ef;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(15,118,110,.08)}.hero{background:linear-gradient(135deg,#48d1c4,#8ff3ea);color:#063b36}h1{margin:0 0 3px;font-size:24px}.update{font-size:12px;opacity:.7;margin-bottom:8px}label{display:block;margin:10px 0 6px;font-weight:800}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #cdeeea;font-size:16px;box-sizing:border-box}input:disabled{background:#f3f4f6;color:#9ca3af}button{width:100%;padding:14px;border:0;border-radius:14px;background:#0f766e;color:#fff;font-weight:900;margin-top:14px;font-size:16px}.copy{background:#111827}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f3fffd;border:1px solid #d1f3ef;border-radius:14px;padding:10px}.k{font-size:12px;color:#666;font-weight:700}.v{font-size:20px;font-weight:900;color:#0f766e}.small{font-size:13px;color:#666;line-height:1.6}.title{font-weight:900;font-size:17px;margin-bottom:8px}.detail{line-height:1.75;font-size:14px}.hint{font-size:12px;color:#666;margin-top:5px}.login-screen{position:fixed;inset:0;background:linear-gradient(#eefdfb,#fff);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:100%;max-width:420px;background:#fff;border:1px solid #d1f3ef;border-radius:22px;padding:22px}.login-title{font-size:24px;font-weight:900;color:#0f766e;margin-bottom:8px}.login-error{color:#ef4444;font-size:14px;font-weight:800;margin-top:10px;display:none}</style></head><body>
<div id="loginScreen" class="login-screen"><div class="login-box"><div class="login-title">極度刮躁｜登入</div><div class="small">登入成功後，同一裝置 30 天內免重新輸入。</div><label>登入密碼</label><input id="loginPassword" type="password"><button onclick="login()">登入</button><div id="loginError" class="login-error">密碼錯誤，請重新輸入。</div></div></div>
<div class="wrap"><div class="hero"><h1>極度刮躁｜定價＋開獎號碼 V20</h1><div class="update">更新時間：2026/09/26 05:12</div><div>輸入商品資料後，系統自動產生定價方案與不重複開獎號碼。</div></div>
<div class="card"><label>商品名稱</label><input id="name" placeholder="例如：海賊王公仔"><label>總成本</label><input id="cost" type="number" value="0"><label>獎號數量</label><input id="wins" type="number" value="1"><label>目標配率 %（預設28%）</label><input id="targetPay" type="number" value="28"><label>每刮售價（二擇一）</label><input id="price" type="number" placeholder="例如：100" oninput="toggleExclusive()"><div class="hint">輸入每刮售價後，系統自動評估刮數。</div><label>自訂刮數（二擇一）</label><input id="customBoard" type="number" placeholder="例如：28" oninput="toggleExclusive()"><div class="hint">輸入自訂刮數後，系統自動反推每刮售價。</div><button onclick="generate()">快速產生並儲存</button></div>
<div class="card" id="result">請輸入資料後按「快速產生並儲存」</div><div class="card" id="copyCard" style="display:none"><div class="title">可複製文字</div><textarea id="copyText" readonly></textarea><button class="copy" onclick="copyOutput()">複製文字</button></div><div class="card"><b>歷史方案紀錄</b><div class="small">歷史紀錄會儲存在目前這台手機／電腦的瀏覽器內。</div></div><div id="history"></div></div>
<script>
const LOGIN_PASSWORD="Ufo7game",LOGIN_KEY="ufo7game_login_until_v16",LOGIN_DAYS=30,KEY="scratch_v16",boards=[12,16,28,30,32,40,70,96,140,150,204,315];
function checkLogin(){loginScreen.style.display=Date.now()<Number(localStorage.getItem(LOGIN_KEY)||"0")?"none":"flex"}function login(){if(loginPassword.value===LOGIN_PASSWORD){localStorage.setItem(LOGIN_KEY,String(Date.now()+LOGIN_DAYS*86400000));loginScreen.style.display="none"}else loginError.style.display="block"}function money(v){return Math.round(v).toLocaleString("zh-TW")}function val(id){return document.getElementById(id).value.trim()}function num(id){return Number(val(id))}
function toggleExclusive(){if(val("price")){customBoard.value="";customBoard.disabled=true}else if(val("customBoard")){price.value="";price.disabled=true}else{price.disabled=false;customBoard.disabled=false}}
function chooseBoardByPrice(cost,wins,p,t){let best=null,tr=cost/(t/100),tb=tr/p;boards.forEach(b=>{if(wins>b)return;let revenue=b*p,profit=revenue-cost,payRate=cost/revenue*100,winRate=wins/b*100,score=Math.abs(payRate-t)*3+Math.abs(b-tb)+(profit<0?999:0)+(b>150?2:0);if(!best||score<best.score)best={board:b,revenue,profit,payRate,winRate,score,price:p}});return best}
function calcByCustomBoard(cost,wins,b,t){if(wins>b)return null;let p=Math.max(1,Math.ceil((cost/(t/100))/b)),revenue=b*p;return{board:b,price:p,revenue,profit:revenue-cost,payRate:cost/revenue*100,winRate:wins/b*100}}
function makeNums(total,count){let a=Array.from({length:total},(_,i)=>i+1);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,count).sort((a,b)=>a-b).map(n=>String(n).padStart(String(total).length,"0"))}
function generate(){let name=val("name")||"未命名商品",cost=num("cost"),wins=Math.floor(num("wins")),t=num("targetPay"),pi=val("price"),bi=val("customBoard");if(cost<=0||wins<=0||t<=0||t>100){alert("請輸入正確資料");return}if((pi&&bi)||(!pi&&!bi)){alert("每刮售價與自訂刮數只能二擇一輸入");return}let r,mode;if(pi){r=chooseBoardByPrice(cost,wins,Number(pi),t);mode="輸入每刮售價，系統評估刮數"}else{r=calcByCustomBoard(cost,wins,Math.floor(Number(bi)),t);mode="輸入自訂刮數，系統反推售價"}if(!r){alert("獎號數量大於刮數");return}let nums=makeNums(r.board,wins),be=Math.ceil(cost/r.price),br=be/r.board*100,rec={generated:new Date().toLocaleString(),name,cost,wins,price:r.price,targetPay:t,mode,board:r.board,revenue:r.revenue,profit:r.profit,payRate:r.payRate,winRate:r.winRate,breakEven:be,breakRate:br,winningNumbers:nums};let arr=JSON.parse(localStorage.getItem(KEY)||"[]");arr.unshift(rec);localStorage.setItem(KEY,JSON.stringify(arr));showResult(rec);showCopy(rec);renderHistory()}
function resultHtml(r,title){return `<div class="title">${title}</div><div class="small">產生時間：${r.generated}<br>模式：${r.mode}</div><div class="grid"><div class="metric"><div class="k">刮數</div><div class="v">${r.board}刮</div></div><div class="metric"><div class="k">獎號數量</div><div class="v">${r.wins}個</div></div><div class="metric"><div class="k">每刮售價</div><div class="v">${money(r.price)}元</div></div><div class="metric"><div class="k">總營收</div><div class="v">${money(r.revenue)}元</div></div><div class="metric"><div class="k">毛利</div><div class="v">${money(r.profit)}元</div></div><div class="metric"><div class="k">實際配率</div><div class="v">${r.payRate.toFixed(1)}%</div></div><div class="metric"><div class="k">中獎率</div><div class="v">${r.winRate.toFixed(1)}%</div></div></div><div class="detail"><br>開獎號碼：${r.winningNumbers.join("、")}</div>`}
function showResult(r){result.innerHTML=resultHtml(r,"本次方案｜"+r.name)}function showCopy(r){copyCard.style.display="block";copyText.value=`${r.name}\n開獎號碼：${r.winningNumbers.join("、")}\n一抽$${money(r.price)}`}function copyOutput(){navigator.clipboard.writeText(copyText.value)}
function renderHistory(){let a=JSON.parse(localStorage.getItem(KEY)||"[]");history.innerHTML=a.map((r,i)=>`<div class="item"><div class="title">${i+1}. ${r.name}</div>${resultHtml(r,"")}</div>`).join("")}checkLogin();renderHistory();toggleExclusive();
</script></body></html>
