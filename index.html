<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>極度刮躁｜刮卡定價產生器 V15</title>
<style>
:root{--main:#48d1c4;--dark:#0f766e;--bg:#eefdfb;--line:#d1f3ef}
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#fff);color:#1f2937}
.wrap{max-width:560px;margin:auto}.hero,.card,.item{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(15,118,110,.08)}
.hero{background:linear-gradient(135deg,#48d1c4,#8ff3ea);color:#063b36}h1{margin:0 0 6px;font-size:24px}
label{display:block;margin:10px 0 6px;font-weight:800}input{width:100%;padding:12px;border-radius:12px;border:1px solid #cdeeea;font-size:16px;background:#fff}input:disabled{background:#f3f4f6;color:#9ca3af}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#0f766e;color:#fff;font-weight:900;margin-top:14px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f3fffd;border:1px solid var(--line);border-radius:14px;padding:10px}.k{font-size:12px;color:#666;font-weight:700}.v{font-size:20px;font-weight:900;color:#0f766e}
.small{font-size:13px;color:#666;line-height:1.6}.title{font-weight:900;font-size:17px;margin-bottom:8px}.detail{line-height:1.75;font-size:14px}.hint{font-size:12px;color:#666;margin-top:5px;line-height:1.5}
.login-screen{position:fixed;inset:0;background:linear-gradient(180deg,#eefdfb,#fff);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:100%;max-width:420px;background:#fff;border:1px solid #d1f3ef;border-radius:22px;padding:22px;box-shadow:0 12px 32px rgba(15,118,110,.14)}
.login-title{font-size:24px;font-weight:900;color:#0f766e;margin-bottom:8px}.login-note{font-size:14px;color:#666;line-height:1.6;margin-bottom:14px}.login-error{color:#ef4444;font-size:14px;font-weight:800;margin-top:10px;display:none}
</style></head>
<body>
<div id="loginScreen" class="login-screen"><div class="login-box"><div class="login-title">極度刮躁｜登入</div><div class="login-note">請輸入登入密碼。登入成功後，同一裝置 30 天內免重新輸入。</div><label>登入密碼</label><input id="loginPassword" type="password" placeholder="請輸入密碼"><button onclick="login()">登入</button><div id="loginError" class="login-error">密碼錯誤，請重新輸入。</div></div></div>
<div class="wrap">
<div class="hero"><h1>極度刮躁｜刮卡定價產生器 V15</h1><div>填表人員必填。配率預設30%，範圍20～33%。每刮售價與自訂刮數只能二擇一。</div></div>
<div class="card">
<label>填表人員姓名（必填）</label><input id="staff" placeholder="例如：小陳">
<label>商品名稱</label><input id="name" placeholder="例如：海賊王公仔">
<label>商品總成本</label><input id="cost" type="number" value="1000">
<label>開獎數量</label><input id="wins" type="number" value="3">
<label>目標配率 %（20～33）</label><input id="targetPay" type="number" value="30" min="20" max="33" step="0.1">
<label>每刮售價（二擇一）</label><input id="price" type="number" placeholder="例如：100" oninput="toggleExclusive()"><div class="hint">輸入每刮售價後，系統會自動評估建議刮數。</div>
<label>自訂刮數（二擇一）</label><input id="customBoard" type="number" placeholder="例如：28" oninput="toggleExclusive()"><div class="hint">輸入自訂刮數後，系統會自動反推每刮售價。</div>
<button onclick="generate()">快速產生並儲存</button>
</div>
<div class="card" id="result">請輸入資料後按「快速產生並儲存」</div>
<div class="card"><b>歷史方案紀錄</b><div class="small">歷史紀錄會儲存在目前這台手機／電腦的瀏覽器內。</div></div>
<div id="history"></div></div>
<script>
const LOGIN_PASSWORD="Ufo7game",LOGIN_KEY="ufo7game_login_until_v15",LOGIN_DAYS=30,KEY="scratch_v15",boards=[12,16,28,30,32,40,70,96,140,150,204,315];
function checkLogin(){const until=Number(localStorage.getItem(LOGIN_KEY)||"0");loginScreen.style.display=Date.now()<until?"none":"flex"}
function login(){if(loginPassword.value===LOGIN_PASSWORD){localStorage.setItem(LOGIN_KEY,String(Date.now()+LOGIN_DAYS*24*60*60*1000));loginScreen.style.display="none";loginError.style.display="none"}else loginError.style.display="block"}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&loginScreen.style.display!=="none")login()});
function money(v){return Math.round(v).toLocaleString("zh-TW")}function num(id){return Number(document.getElementById(id).value)}function txt(id){return document.getElementById(id).value.trim()}
function toggleExclusive(){const p=price,b=customBoard;if(p.value.trim()!==""){b.value="";b.disabled=true}else if(b.value.trim()!==""){p.value="";p.disabled=true}else{p.disabled=false;b.disabled=false}}
function chooseBoardByPrice(cost,wins,p,targetPay){let best=null,targetRevenue=cost/(targetPay/100),targetBoard=targetRevenue/p;boards.forEach(board=>{if(wins>board)return;const revenue=board*p,profit=revenue-cost,payRate=cost/revenue*100,winRate=wins/board*100;let score=Math.abs(payRate-targetPay)*3+Math.abs(board-targetBoard)+(winRate>50?999:0)+(profit<0?999:0)+(board>150?2:0);if(!best||score<best.score)best={board,revenue,profit,payRate,winRate,score,price:p}});return best}
function calcByCustomBoard(cost,wins,board,targetPay){if(wins>board)return null;const targetRevenue=cost/(targetPay/100),p=Math.max(1,Math.ceil(targetRevenue/board)),revenue=board*p,profit=revenue-cost,payRate=cost/revenue*100,winRate=wins/board*100;return{board,revenue,profit,payRate,winRate,price:p}}
function generate(){
 const staff=txt("staff"),name=txt("name")||"未命名商品",cost=num("cost"),wins=Math.floor(num("wins")),targetPay=num("targetPay"),priceInput=txt("price"),boardInput=txt("customBoard");
 if(!staff){alert("請輸入填表人員姓名");return}
 if(cost<=0||wins<=0||targetPay<20||targetPay>33){alert("請輸入正確資料，目標配率只能輸入20～33%");return}
 if((priceInput&&boardInput)||(!priceInput&&!boardInput)){alert("每刮售價與自訂刮數只能二擇一輸入");return}
 let r=null,mode="";
 if(priceInput){const p=Number(priceInput);if(p<=0){alert("請輸入正確的每刮售價");return}r=chooseBoardByPrice(cost,wins,p,targetPay);mode="輸入每刮售價，系統評估刮數"}
 else{const board=Math.floor(Number(boardInput));if(board<=0){alert("請輸入正確的自訂刮數");return}r=calcByCustomBoard(cost,wins,board,targetPay);mode="輸入自訂刮數，系統反推售價"}
 if(!r){alert("開獎數量大於刮數，請調整開獎數量或刮數。");return}
 const breakEven=Math.ceil(cost/r.price),breakRate=breakEven/r.board*100;
 const rec={id:Date.now()+Math.floor(Math.random()*1000),generated:new Date().toLocaleString(),staff,name,cost,wins,price:r.price,targetPay,mode,board:r.board,revenue:r.revenue,profit:r.profit,payRate:r.payRate,winRate:r.winRate,breakEven,breakRate};
 const arr=JSON.parse(localStorage.getItem(KEY)||"[]");arr.unshift(rec);localStorage.setItem(KEY,JSON.stringify(arr));showResult(rec);renderHistory()
}
function resultHtml(r,titleText){return `<div class="title">${titleText}</div><div class="small">產生時間：${r.generated}<br>填表人員：${r.staff}<br>模式：${r.mode}</div><div class="grid">
<div class="metric"><div class="k">建議／自訂刮數</div><div class="v">${r.board}刮</div></div><div class="metric"><div class="k">開獎數量</div><div class="v">${r.wins}個</div></div><div class="metric"><div class="k">每刮售價</div><div class="v">${money(r.price)}元</div></div><div class="metric"><div class="k">總營收</div><div class="v">${money(r.revenue)}元</div></div><div class="metric"><div class="k">毛利</div><div class="v">${money(r.profit)}元</div></div><div class="metric"><div class="k">目標配率</div><div class="v">${r.targetPay}%</div></div><div class="metric"><div class="k">實際配率</div><div class="v">${r.payRate.toFixed(1)}%</div></div><div class="metric"><div class="k">中獎率</div><div class="v">${r.winRate.toFixed(1)}%</div></div><div class="metric"><div class="k">回本刮數</div><div class="v">${r.breakEven}刮</div></div><div class="metric"><div class="k">回本銷售率</div><div class="v">${r.breakRate.toFixed(1)}%</div></div></div>`}
function showResult(r){result.innerHTML=resultHtml(r,"本次方案｜"+r.name)}
function renderHistory(){const arr=JSON.parse(localStorage.getItem(KEY)||"[]");if(!arr.length){history.innerHTML='<div class="item small">目前沒有紀錄</div>';return}history.innerHTML=arr.map((r,i)=>`<div class="item"><div class="title">${i+1}. ${r.name}</div><div class="small">產生時間：${r.generated}<br>填表人員：${r.staff}<br>模式：${r.mode}</div><div class="detail">商品成本：${money(r.cost)}元<br>建議／自訂刮數：${r.board}刮<br>開獎數量：${r.wins}個<br>每刮售價：${money(r.price)}元<br>總營收：${money(r.revenue)}元<br>毛利：${money(r.profit)}元<br>目標配率：${r.targetPay}%<br>實際配率：${r.payRate.toFixed(1)}%<br>中獎率：${r.winRate.toFixed(1)}%<br>回本刮數：${r.breakEven}刮<br>回本銷售率：${r.breakRate.toFixed(1)}%</div></div>`).join("")}
checkLogin();renderHistory();toggleExclusive();
</script></body></html>
