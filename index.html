<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>極度刮躁｜定價＋開獎號碼 V18</title>
<style>
body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:linear-gradient(#eefdfb,#fff);color:#1f2937}
.wrap{max-width:560px;margin:auto}.hero,.card,.item{background:#fff;border:1px solid #d1f3ef;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(15,118,110,.08)}
.hero{background:linear-gradient(135deg,#48d1c4,#8ff3ea);color:#063b36}h1{margin:0 0 6px;font-size:24px}
label{display:block;margin:10px 0 6px;font-weight:800}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #cdeeea;font-size:16px;box-sizing:border-box}input:disabled{background:#f3f4f6;color:#9ca3af}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#0f766e;color:#fff;font-weight:900;margin-top:14px;font-size:16px}.copy{background:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f3fffd;border:1px solid #d1f3ef;border-radius:14px;padding:10px}.k{font-size:12px;color:#666;font-weight:700}.v{font-size:20px;font-weight:900;color:#0f766e}
.small{font-size:13px;color:#666;line-height:1.6}.title{font-weight:900;font-size:17px;margin-bottom:8px}.detail{line-height:1.75;font-size:14px}.hint{font-size:12px;color:#666;margin-top:5px}
.login-screen{position:fixed;inset:0;background:linear-gradient(#eefdfb,#fff);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:100%;max-width:420px;background:#fff;border:1px solid #d1f3ef;border-radius:22px;padding:22px;box-shadow:0 12px 32px rgba(15,118,110,.14)}
.login-title{font-size:24px;font-weight:900;color:#0f766e;margin-bottom:8px}.login-error{color:#ef4444;font-size:14px;font-weight:800;margin-top:10px;display:none}
</style></head><body>
<div id="loginScreen" class="login-screen"><div class="login-box"><div class="login-title">極度刮躁｜登入</div><div class="small">登入成功後，同一裝置 30 天內免重新輸入。</div><label>登入密碼</label><input id="loginPassword" type="password" placeholder="請輸入密碼"><button onclick="login()">登入</button><div id="loginError" class="login-error">密碼錯誤，請重新輸入。</div></div></div>
<div class="wrap">
<div class="hero"><h1>極度刮躁｜定價＋開獎號碼 V18</h1><div>輸入商品資料後，系統自動產生定價方案與不重複開獎號碼。</div></div>
<div class="card">
<label>商品名稱</label><input id="name" placeholder="例如：海賊王公仔">
<label>總成本</label><input id="cost" type="number" value="1000">
<label>獎號數量</label><input id="wins" type="number" value="3">
<label>目標配率 %（預設33%）</label><input id="targetPay" type="number" value="33" min="1" max="100" step="0.1">
<label>優惠刮數 %（預設10%）</label><input id="bonusRate" type="number" value="10" min="0" max="30" step="1"><div class="hint">優惠刮數會加在販售刮數之外，用來讓店家先刮開；配率仍以販售刮數計算。</div>
<label>每刮售價（二擇一）</label><input id="price" type="number" placeholder="例如：100" oninput="toggleExclusive()"><div class="hint">輸入每刮售價後，系統自動評估販售刮數。</div>
<label>自訂刮數（二擇一）</label><input id="customBoard" type="number" placeholder="例如：28" oninput="toggleExclusive()"><div class="hint">輸入自訂刮數後，系統自動反推每刮售價。</div>
<button onclick="generate()">快速產生並儲存</button>
</div>
<div class="card" id="result">請輸入資料後按「快速產生並儲存」</div>
<div class="card" id="copyCard" style="display:none"><div class="title">可複製文字</div><textarea id="copyText" readonly></textarea><button class="copy" onclick="copyOutput()">複製文字</button></div>
<div class="card"><b>歷史方案紀錄</b><div class="small">歷史紀錄會儲存在目前這台手機／電腦的瀏覽器內。</div></div><div id="history"></div>
</div>
<script>
const LOGIN_PASSWORD="Ufo7game",LOGIN_KEY="ufo7game_login_until_v18",LOGIN_DAYS=30,KEY="scratch_v18";
function checkLogin(){loginScreen.style.display=Date.now()<Number(localStorage.getItem(LOGIN_KEY)||"0")?"none":"flex"}
function login(){if(loginPassword.value===LOGIN_PASSWORD){localStorage.setItem(LOGIN_KEY,String(Date.now()+LOGIN_DAYS*86400000));loginScreen.style.display="none";loginError.style.display="none"}else loginError.style.display="block"}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&loginScreen.style.display!=="none")login()});
function money(v){return Math.round(v).toLocaleString("zh-TW")}function val(id){return document.getElementById(id).value.trim()}function num(id){return Number(val(id))}
function toggleExclusive(){if(val("price")!==""){customBoard.value="";customBoard.disabled=true}else if(val("customBoard")!==""){price.value="";price.disabled=true}else{price.disabled=false;customBoard.disabled=false}}
function chooseBoardByPrice(cost,wins,p,targetPay){
 let board=Math.max(1,wins);
 while(board<=999999){
  let revenue=board*p,payRate=cost/revenue*100;
  if(payRate<=targetPay){return{board,revenue,profit:revenue-cost,payRate,winRate:wins/board*100,price:p}}
  board++;
 }
 return null;
}
function calcByCustomBoard(cost,wins,board,targetPay){if(wins>board)return null;let p=Math.max(1,Math.ceil((cost/(targetPay/100))/board)),revenue=board*p;return{board,price:p,revenue,profit:revenue-cost,payRate:cost/revenue*100,winRate:wins/board*100}}
function makeNums(total,count){let a=[];for(let i=1;i<=total;i++)a.push(i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,count).sort((x,y)=>x-y).map(n=>String(n).padStart(String(total).length,"0"))}
function generate(){
 let name=val("name")||"未命名商品",cost=num("cost"),wins=Math.floor(num("wins")),targetPay=num("targetPay"),bonusRate=num("bonusRate"),priceIn=val("price"),boardIn=val("customBoard");
 if(cost<=0||wins<=0||targetPay<=0||targetPay>100){alert("請輸入正確資料");return}
 if(bonusRate<0||bonusRate>30){alert("優惠刮數請輸入 0～30%");return}
 if((priceIn&&boardIn)||(!priceIn&&!boardIn)){alert("每刮售價與自訂刮數只能二擇一輸入");return}
 let r=null,mode="";
 if(priceIn){let p=Number(priceIn);if(p<=0){alert("請輸入正確的每刮售價");return}r=chooseBoardByPrice(cost,wins,p,targetPay);mode="輸入每刮售價，系統評估販售刮數"}else{let board=Math.floor(Number(boardIn));if(board<=0){alert("請輸入正確的自訂刮數");return}r=calcByCustomBoard(cost,wins,board,targetPay);mode="輸入自訂刮數，系統反推售價"}
 if(!r){alert("獎號數量大於刮數，請調整獎號數量或刮數。");return}
 let saleBoard=r.board,bonusBoard=Math.ceil(saleBoard*bonusRate/100),totalBoard=saleBoard+bonusBoard;
 let nums=makeNums(saleBoard,wins),breakEven=Math.ceil(cost/r.price),breakRate=breakEven/saleBoard*100;
 let rec={id:Date.now()+Math.floor(Math.random()*1000),generated:new Date().toLocaleString(),name,cost,wins,price:r.price,targetPay,bonusRate,mode,saleBoard,bonusBoard,totalBoard,board:saleBoard,revenue:r.revenue,profit:r.profit,payRate:r.payRate,winRate:r.winRate,breakEven,breakRate,winningNumbers:nums};
 let arr=JSON.parse(localStorage.getItem(KEY)||"[]");arr.unshift(rec);localStorage.setItem(KEY,JSON.stringify(arr));showResult(rec);showCopy(rec);renderHistory()
}
function resultHtml(r,title){return `<div class="title">${title}</div><div class="small">產生時間：${r.generated}<br>模式：${r.mode}</div><div class="grid"><div class="metric"><div class="k">販售刮數</div><div class="v">${r.saleBoard||r.board}刮</div></div><div class="metric"><div class="k">優惠刮數</div><div class="v">${r.bonusBoard||0}刮</div></div><div class="metric"><div class="k">總製作刮數</div><div class="v">${r.totalBoard||r.board}刮</div></div><div class="metric"><div class="k">獎號數量</div><div class="v">${r.wins}個</div></div><div class="metric"><div class="k">每刮售價</div><div class="v">${money(r.price)}元</div></div><div class="metric"><div class="k">總營收</div><div class="v">${money(r.revenue)}元</div></div><div class="metric"><div class="k">毛利</div><div class="v">${money(r.profit)}元</div></div><div class="metric"><div class="k">目標配率</div><div class="v">${r.targetPay}%</div></div><div class="metric"><div class="k">實際配率</div><div class="v">${r.payRate.toFixed(2)}%</div></div><div class="metric"><div class="k">中獎率</div><div class="v">${r.winRate.toFixed(1)}%</div></div><div class="metric"><div class="k">回本刮數</div><div class="v">${r.breakEven}刮</div></div><div class="metric"><div class="k">回本銷售率</div><div class="v">${r.breakRate.toFixed(1)}%</div></div></div><div class="detail"><br>開獎號碼：${r.winningNumbers.join("、")}</div>`}
function showResult(r){result.innerHTML=resultHtml(r,"本次方案｜"+r.name)}
function showCopy(r){copyCard.style.display="block";copyText.value=`${r.name}\n開獎號碼：${r.winningNumbers.join("、")}\n一抽$${money(r.price)}\n\n販售刮數：${r.saleBoard||r.board}刮\n優惠刮數：${r.bonusBoard||0}刮\n總製作刮數：${r.totalBoard||r.board}刮`}
function copyOutput(){navigator.clipboard.writeText(copyText.value).then(()=>alert("已複製")).catch(()=>alert("複製失敗，請手動選取文字"))}
function renderHistory(){let arr=JSON.parse(localStorage.getItem(KEY)||"[]");if(!arr.length){history.innerHTML='<div class="item small">目前沒有紀錄</div>';return}history.innerHTML=arr.map((r,i)=>`<div class="item"><div class="title">${i+1}. ${r.name}</div><div class="small">產生時間：${r.generated}<br>模式：${r.mode}</div><div class="detail">商品成本：${money(r.cost)}元<br>販售刮數：${r.saleBoard||r.board}刮<br>優惠刮數：${r.bonusBoard||0}刮<br>總製作刮數：${r.totalBoard||r.board}刮<br>獎號數量：${r.wins}個<br>每刮售價：${money(r.price)}元<br>總營收：${money(r.revenue)}元<br>毛利：${money(r.profit)}元<br>目標配率：${r.targetPay}%<br>實際配率：${r.payRate.toFixed(2)}%<br>中獎率：${r.winRate.toFixed(1)}%<br>回本刮數：${r.breakEven}刮<br>回本銷售率：${r.breakRate.toFixed(1)}%<br>開獎號碼：${r.winningNumbers.join("、")}</div></div>`).join("")}
checkLogin();renderHistory();toggleExclusive();
</script></body></html>
