<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極度刮躁｜機率遊戲定價</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#183a37;background:#f1faf8}*{box-sizing:border-box}body{margin:0;padding:20px 12px}.wrap{max-width:600px;margin:0 auto;background:white;border-radius:18px;box-shadow:0 8px 28px #1c7c6c16;overflow:hidden}header{background:#74d9cc;padding:22px 20px}h1{font-size:22px;margin:0}main{padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:16px}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input{width:100%;font-size:19px;border:1px solid #bdd8d2;border-radius:10px;padding:12px;background:#fff;color:#183a37}input:focus{outline:2px solid #4bbbab}small{display:block;color:#57736e;line-height:1.6;margin-top:6px}.heading{font-weight:800;margin:8px 0 12px;border-bottom:1px solid #e4efec;padding-bottom:12px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #edf2f0}.item span{font-size:17px;font-weight:700}.item strong{font-size:21px;color:#127c6d;font-variant-numeric:tabular-nums}.custom{margin-top:18px;padding-top:15px;border-top:2px solid #e4efec}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:8px}@media(max-width:360px){.fields{grid-template-columns:1fr}} </style></head><body><div class="wrap"><header><h1>極度刮躁｜機率遊戲定價</h1></header><main><div class="fields"><div class="field"><label for="cost">商品成本（元）</label><input id="cost" type="number" min="0.01" step="any" value="1000" inputmode="decimal"></div><div class="field"><label for="rate">目標成本率（%）</label><input id="rate" type="number" min="0.01" max="100" step="any" value="35" inputmode="decimal"></div></div><div class="field"><label for="free">前幾抽內中獎免費</label><input id="free" type="number" min="0" step="1" value="2" inputmode="numeric"><small>例如填2：第1、2抽中獎，商品及全部抽數免費；第3抽起中獎，包含前面所有抽數及中獎當抽，全部計費。</small></div><div class="heading">各玩法建議每抽售價</div><div id="results"></div><div class="custom"><label for="custom">自行輸入總抽數</label><input id="custom" type="number" min="2" max="1000000" step="1" placeholder="例如 80" inputmode="numeric"><div id="customResult"></div></div><div id="error" class="error" role="status"></div></main></div><script>const $=id=>document.getElementById(id);const fixed=[2,4,6,8,9,12,20,30,40,50,60];const fmt=new Intl.NumberFormat('en-US');function render(){const cost=$('cost').value,rate=$('rate').value,free=$('free').value;const c=Number(cost),r=Number(rate),k=Number(free);const valid=cost.trim()!==''&&rate.trim()!==''&&free.trim()!==''&&Number.isFinite(c)&&c>0&&Number.isFinite(r)&&r>0&&r<=100&&Number.isSafeInteger(k)&&k>=0;function price(n){if(!valid||!Number.isSafeInteger(n)||n<2||n>1000000)return null;const f=Math.min(k,n);const avg=(n*(n+1)-f*(f+1))/(2*n);if(avg<=0)return null;const raw=c/(r/100*avg);if(!Number.isFinite(raw)||raw>Number.MAX_SAFE_INTEGER)return null;return Math.ceil(raw/10-1e-12)*10}function line(n){const p=price(n);return `<div class="item"><span>1/${n}</span><strong>${!valid?'—':p===null?'無法定價':'$'+fmt.format(p)}</strong></div>`}$('results').innerHTML=fixed.map(line).join('');const custom=$('custom').value.trim();$('customResult').innerHTML=custom!==''&&Number.isSafeInteger(Number(custom))&&Number(custom)>=2&&Number(custom)<=1000000?line(Number(custom)):'';$('error').textContent=!valid?'請輸入有效的成本、成本率（大於0且不超過100）及非負整數免費抽數。':custom!==''&&(!Number.isSafeInteger(Number(custom))||Number(custom)<2||Number(custom)>1000000)?'自訂總抽數請輸入2～1,000,000的整數。':''}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',render));render();</script></body></html>
